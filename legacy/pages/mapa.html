<!DOCTYPE html>

<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Peludinhos - Mapa</title>

    <link
        href="https://fonts.googleapis.com"
        rel="preconnect"
    >

    <link
        crossorigin
        href="https://fonts.gstatic.com"
        rel="preconnect"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/output.css"
    >

    <link
        rel="stylesheet"
        href="../css/mapa.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
        rel="stylesheet"
    >

<script src="../js/auth.js"></script>
<script>exigirLogin();</script>
</head>

<body class="min-h-screen flex flex-col bg-gray-100 text-gray-800">
  <div class="w-full sm:max-w-sm mx-auto min-h-screen flex flex-col font-sans bg-surface relative sm:shadow-2xl overflow-hidden">
    <header class="bg-brand-teal text-white z-20 relative pt-2 pb-4 px-4 rounded-b-3xl shadow-md flex flex-col gap-4">

        <div class="flex items-center justify-between">

            <button
                aria-label="Menu"
                class="text-2xl p-1"
            >
                <i class="ri-menu-line"></i>
            </button>

            <div class="flex items-center gap-2">
                <img src="../assets/icons/peludinhos.svg" alt="Logo" class="h-6 w-auto brightness-0 invert">
                <h1 class="text-xl font-bold tracking-tight">Peludinhos</h1>
            </div>

            <button
                aria-label="Notificações"
                class="text-2xl p-1 relative"
            >
                <i class="ri-notification-3-line"></i>
            </button>

        </div>

        <div class="flex items-center gap-3">

            <div class="relative flex-1">

                <input
                    class="w-full pl-4 pr-10 py-3 rounded-xl bg-white text-gray-800 placeholder-gray-400 focus:outline-none border-none shadow-sm text-sm"
                    placeholder="Buscar animais ou locais"
                    type="text"
                >

                <i
                    class="ri-search-line absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"
                ></i>

            </div>

            <button
                aria-label="Filtrar"
                class="bg-white p-3 rounded-xl text-gray-600 shadow-sm"
            >
                <i class="ri-list-settings-line text-lg"></i>
            </button>

        </div>

    </header>
    <main class="flex-1 relative z-10 -mt-8 h-full min-h-[400px]">

        <div id="map" class="absolute inset-0 z-0"></div>
        
        <!-- Action Button -->
        <div class="absolute bottom-[275px] left-1/2 -translate-x-1/2 z-30 w-full px-8">
            <a href="novo_avistamento.html" class="bg-brand-teal text-white w-full py-4 rounded-2xl flex items-center justify-center gap-2 font-bold shadow-lg text-lg hover:bg-teal-800 transition-colors">
                <i class="ri-add-line text-2xl"></i>
                Novo avistamento
            </a>
        </div>

        <!-- Bottom Sheet (Recent Sightings) -->
        <div class="absolute bottom-0 w-full bg-white rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.1)] z-20 pb-20 pt-6 px-6 h-64 overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800">Avistamentos recentes</h2>
                <a href="animais.html" class="text-teal-700 text-sm font-semibold">Ver todos</a>
            </div>

            <div class="flex flex-col gap-4">
                <!-- Sighting Card -->
                <a href="detalhes_animal.html" class="border border-gray-100 rounded-2xl p-3 flex items-center justify-between shadow-sm">
                    <div class="flex items-center gap-4">
                        <img src="../assets/images/cachorro1.jpg" alt="Cachorro" class="w-16 h-16 rounded-xl object-cover" onerror="this.src='https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80'">
                        <div>
                            <h3 class="font-bold text-gray-800">Cachorro</h3>
                            <p class="text-xs text-gray-500 mt-1">Visto há 2h • Bairro Aeroporto</p>
                            <span class="inline-block mt-2 px-2 py-0.5 rounded border border-teal-600 text-teal-700 text-[10px] font-medium">Castrado</span>
                        </div>
                    </div>
                    <i class="ri-arrow-right-s-line text-gray-400 text-xl"></i>
                </a>

                <!-- Sighting Card -->
                <a href="detalhes_animal.html" class="border border-gray-100 rounded-2xl p-3 flex items-center justify-between shadow-sm">
                    <div class="flex items-center gap-4">
                        <img src="../assets/images/gato1.jpg" alt="Gato" class="w-16 h-16 rounded-xl object-cover" onerror="this.src='https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80'">
                        <div>
                            <h3 class="font-bold text-gray-800">Gato</h3>
                            <p class="text-xs text-gray-500 mt-1">Visto há 4h • Av. Brasil</p>
                            <span class="inline-block mt-2 px-2 py-0.5 rounded border border-orange-400 text-orange-500 text-[10px] font-medium">Não castrado</span>
                        </div>
                    </div>
                    <i class="ri-arrow-right-s-line text-gray-400 text-xl"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 mx-auto w-full sm:max-w-sm bg-white border-t border-gray-100 flex justify-around items-center py-2 px-4 pb-safe z-30 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
        <a href="animais.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-600 transition-colors">
            <div class="mask-patinhas w-6 h-6 mb-1 bg-gray-400"></div>
            <span class="text-[10px] font-medium">Animais</span>
        </a>
        <a href="mapa.html" class="flex flex-col items-center p-2 text-brand-orange">
            <i class="ri-map-pin-2-fill text-2xl"></i>
            <span class="text-[10px] font-medium mt-1">Mapa</span>
        </a>
        <a href="perdidos.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="ri-megaphone-fill text-2xl"></i>
            <span class="text-[10px] font-medium mt-1">Perdidos</span>
        </a>
        <a href="perfil.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="ri-user-fill text-2xl"></i>
            <span class="text-[10px] font-medium mt-1">Perfil</span>
        </a>
    </nav>
    <style>
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1rem);
        }
    </style>
  </div>
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>

<script src="../js/mapa.js"></script>

</body>
</html>
