<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peludinhos - Animais</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/output.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<script src="../js/auth.js"></script>
<script>exigirLogin();</script>
</head>
<body class="min-h-screen flex flex-col bg-gray-100 text-gray-800">
  <div class="w-full sm:max-w-sm mx-auto min-h-screen flex flex-col font-sans bg-surface relative sm:shadow-2xl">
    <header class="bg-brand-teal text-white z-20 relative pt-2 pb-6 px-4 rounded-b-[2rem] shadow-md flex flex-col gap-4">
        <div class="flex items-center justify-between">

            <div class="flex items-center gap-2">
                <img src="../assets/icons/peludinhos.svg" alt="Logo" class="h-6 w-auto brightness-0 invert">
                <h1 class="text-xl font-bold tracking-tight">Peludinhos</h1>
            </div>
            <button aria-label="Notificações" class="text-2xl p-1 relative">
                <i class="ri-notification-3-line"></i>
            </button>
        </div>
        <div class="flex items-center gap-3">
            <div class="relative flex-1">
                <input class="w-full pl-4 pr-10 py-3 rounded-xl bg-white text-gray-800 placeholder-gray-400 focus:outline-none border-none shadow-sm text-sm" placeholder="Buscar animais ou locais" type="text">
                <i class="ri-search-line absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
            </div>
            <button aria-label="Filtrar" class="bg-white p-3 rounded-xl text-gray-600 shadow-sm">
                <i class="ri-list-settings-line text-lg"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto z-10 px-4 pt-6 pb-24">
        <div class="flex gap-2 overflow-x-auto pb-4 no-scrollbar">
            <button class="px-5 py-2 rounded-full bg-brand-teal text-white text-sm font-medium whitespace-nowrap">Todos</button>
            <button class="px-5 py-2 rounded-full bg-white text-gray-600 text-sm font-medium whitespace-nowrap shadow-sm">Cachorros</button>
            <button class="px-5 py-2 rounded-full bg-white text-gray-600 text-sm font-medium whitespace-nowrap shadow-sm">Gatos</button>
            <button class="px-5 py-2 rounded-full bg-white text-gray-600 text-sm font-medium whitespace-nowrap shadow-sm">Chipados</button>
        </div>

        <div class="flex flex-col gap-4 mt-2">
            <!-- Animal Card -->
            <a href="detalhes_animal.html" class="bg-white rounded-2xl p-3 shadow-sm flex items-center gap-4 relative overflow-hidden">
                <img src="../assets/images/rex.jpg" alt="Rex" class="w-20 h-20 rounded-xl object-cover" onerror="this.src='https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80'">
                <div class="flex-1 relative z-10">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-lg font-bold text-gray-800">Rex</h2>
                            <p class="text-xs text-gray-500 mt-1">Visto há 1h • Centro</p>
                        </div>
                        <button class="text-gray-400 p-1"><i class="ri-more-2-fill text-xl"></i></button>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <span class="px-3 py-1 rounded-full border border-teal-600 text-teal-700 text-xs font-medium">Castrado</span>
                        <span class="px-3 py-1 rounded-full border border-teal-600 text-teal-700 text-xs font-medium">Chipado</span>
                    </div>
                </div>
                <div class="text-brand-orange opacity-20 absolute right-4 bottom-4 pointer-events-none z-0">
                    <i class="ri-bear-smile-fill text-4xl"></i>
                </div>
            </a>
            
            <!-- Animal Card -->
            <a href="detalhes_animal.html" class="bg-white rounded-2xl p-3 shadow-sm flex items-center gap-4 relative overflow-hidden">
                <img src="../assets/images/mel.jpg" alt="Mel" class="w-20 h-20 rounded-xl object-cover" onerror="this.src='https://images.unsplash.com/photo-1583337130417-3346a1be7dee?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80'">
                <div class="flex-1 relative z-10">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-lg font-bold text-gray-800">Mel</h2>
                            <p class="text-xs text-gray-500 mt-1">Visto há 3h • Parque da Cidade</p>
                        </div>
                        <button class="text-gray-400 p-1"><i class="ri-more-2-fill text-xl"></i></button>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <span class="px-3 py-1 rounded-full border border-orange-400 text-orange-500 text-xs font-medium">Não castrado</span>
                    </div>
                </div>
                <div class="text-brand-orange opacity-20 absolute right-4 bottom-4 pointer-events-none z-0">
                    <i class="ri-bear-smile-fill text-4xl"></i>
                </div>
            </a>

            <!-- Animal Card -->
            <a href="detalhes_animal.html" class="bg-white rounded-2xl p-3 shadow-sm flex items-center gap-4 relative overflow-hidden">
                <img src="../assets/images/nina.jpg" alt="Nina" class="w-20 h-20 rounded-xl object-cover" onerror="this.src='https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80'">
                <div class="flex-1 relative z-10">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-lg font-bold text-gray-800">Nina</h2>
                            <p class="text-xs text-gray-500 mt-1">Visto há 5h • Ufopa</p>
                        </div>
                        <button class="text-gray-400 p-1"><i class="ri-more-2-fill text-xl"></i></button>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <span class="px-3 py-1 rounded-full border border-teal-600 text-teal-700 text-xs font-medium">Vacinada</span>
                        <span class="px-3 py-1 rounded-full border border-teal-600 text-teal-700 text-xs font-medium">Chipado</span>
                    </div>
                </div>
                <div class="text-brand-orange opacity-20 absolute right-4 bottom-2 pointer-events-none z-0">
                    <i class="ri-bear-smile-fill text-4xl"></i>
                </div>
            </a>

            <!-- Animal Card -->
            <a href="detalhes_animal.html" class="bg-white rounded-2xl p-3 shadow-sm flex items-center gap-4 relative overflow-hidden">
                <img src="../assets/images/thor.jpg" alt="Thor" class="w-20 h-20 rounded-xl object-cover" onerror="this.src='https://images.unsplash.com/photo-1573865526739-10659fec78a5?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80'">
                <div class="flex-1 relative z-10">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-lg font-bold text-gray-800">Thor</h2>
                            <p class="text-xs text-gray-500 mt-1">Visto há 1 dia • Parque da Cidade</p>
                        </div>
                        <button class="text-gray-400 p-1"><i class="ri-more-2-fill text-xl"></i></button>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <span class="px-3 py-1 rounded-full border border-teal-600 text-teal-700 text-xs font-medium">Castrado</span>
                    </div>
                </div>
                <div class="text-brand-orange opacity-10 absolute right-4 bottom-2 pointer-events-none z-0">
                    <i class="ri-bear-smile-fill text-4xl"></i>
                </div>
            </a>
        </div>
    </main>

    <!-- Floating Action Button -->
    <div class="fixed bottom-28 left-0 right-0 mx-auto w-full sm:max-w-sm pointer-events-none z-40">
        <a href="novo_avistamento.html" class="absolute right-4 w-14 h-14 bg-brand-teal hover:bg-teal-800 text-white rounded-full shadow-lg flex items-center justify-center transition-colors pointer-events-auto">
            <i class="ri-add-line text-2xl"></i>
        </a>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 mx-auto w-full sm:max-w-sm bg-white border-t border-gray-100 flex justify-around items-center py-2 px-4 pb-safe z-30 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
        <a href="animais.html" class="flex flex-col items-center p-2 text-brand-orange">
            <div class="mask-patinhas w-6 h-6 mb-1 bg-brand-orange"></div>
            <span class="text-[10px] font-medium">Animais</span>
        </a>
        <a href="mapa.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="ri-map-pin-2-fill text-2xl"></i>
            <span class="text-[10px] font-medium mt-1">Mapa</span>
        </a>
        <a href="perdidos.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="ri-megaphone-fill text-2xl"></i>
            <span class="text-[10px] font-medium mt-1">Perdidos</span>
        </a>
        <a href="perfil.html" class="flex flex-col items-center p-2 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="ri-user-fill text-2xl"></i>
            <span class="text-[10px] font-medium mt-1">Perfil</span>
        </a>
    </nav>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 1rem);
        }
    </style>
  </div>
</body>
</html>
